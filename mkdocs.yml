site_name: Maritime Academy - Achour Benkaci

site_description: Maritime Engineering and Technical Management Courses

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue
      accent: cyan
    - scheme: slate
      primary: blue
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Introduction to Shipping: courses/introduction-shipping.md
  - Flag State Control: courses/flag-state-control.md
  - Classification Societies: courses/classification.md
  - Recognized Organizations: courses/ro.md
  - Port State Control: courses/psc.md
  - Maintenance: courses/maintenance.md
  - Energy Management: courses/energy-management.md
  - MARPOL Annex VI: courses/marpol-annex-6.md
  - Exercises: courses/exercises-cases.md

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
